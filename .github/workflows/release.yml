name: Release

# Push a tag like v0.1.0 to publish a release. site/install.sh downloads its
# assets via releases/latest/download, so asset names carry no version.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  GO_VERSION: '1.27'
  NODE_VERSION: '22'

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build release archives
        run: make dist VERSION="$GITHUB_REF_NAME"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/release/* --verify-tag --generate-notes $flags
