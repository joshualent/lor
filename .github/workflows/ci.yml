name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.27'
  NODE_VERSION: '22'

jobs:
  go:
    name: Go (generate, build, vet, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install shellcheck and ssh-keygen
        run: sudo apt-get update && sudo apt-get install -y shellcheck openssh-client
      - name: Build (SPA embedded)
        run: make build
      - name: Generated code is up to date
        run: |
          make generate
          git diff --exit-code
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -count=1 ./...
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: bin/
          retention-days: 7

  web:
    name: Frontend (svelte-check, lint, vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web run check
      - run: pnpm -C web run lint
      - run: pnpm -C web exec vitest run

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build
        run: |
          make build
          go build -o bin/fakessh ./test/e2e/fakessh
      - run: pnpm -C web exec playwright install --with-deps chromium
      - run: pnpm -C web exec playwright test
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: |
            web/playwright-report/
            web/test-results/
            test/e2e/.tmp/screens/
          retention-days: 7

  integration:
    name: Integration (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: ['debian:12', 'debian:13', 'ubuntu:22.04', 'ubuntu:24.04', 'ubuntu:26.04']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build
        run: make build
      - name: Real OpenSSH in Docker
        run: go test -tags integration -count=1 -timeout 20m -v ./test/integration/...
        env:
          DISTRO: ${{ matrix.distro }}
